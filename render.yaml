services:
  - type: web
    name: crypto-stat-arb-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: BINANCE_TESTNET
        value: "true"
